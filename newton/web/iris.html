<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__NAME__ · Newton</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3CradialGradient id='g' cx='.5' cy='.5' r='.5'%3E%3Cstop offset='.55' stop-color='%23080D13'/%3E%3Cstop offset='.56' stop-color='%233DF5A7'/%3E%3Cstop offset='1' stop-color='%236D8BFF'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='30' fill='url(%23g)'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#0B0F14;--side:#0E1319;--panel:#121922;--panel2:#18212C;--line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.16);
  --text:#E8EEF5;--muted:#8E9BAD;--faint:#5D6B7E;--accent:#3DF5A7;--accent-ink:#04130B;--warn:#F5B14A;--bad:#FF7B72;--good:#3DF5A7;
  --user:#17212C;--code:#0A1017;--shadow:0 20px 60px -30px rgba(0,0,0,.8);
  --spectrum:conic-gradient(from 210deg,#B6F23B,#3DF5A7,#19C6C0,#6D8BFF,#B07CFF,#FF8AD8,#FFB86B,#B6F23B);
  --sans:ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
}
[data-theme=light]{--bg:#F7F8FA;--side:#EEF1F5;--panel:#FFFFFF;--panel2:#F1F4F8;--line:rgba(10,20,35,.1);--line2:rgba(10,20,35,.18);--text:#141C26;--muted:#5C6878;--faint:#8C97A6;--accent:#067A55;--accent-ink:#fff;--warn:#B26B00;--bad:#C0392B;--good:#067A55;--user:#E6EBF1;--code:#F1F4F8;--shadow:0 20px 50px -30px rgba(10,20,35,.35)}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:400 15.5px/1.6 var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden}
button,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:8px}
.app{display:grid;grid-template-columns:272px minmax(0,1fr);height:100dvh}
/* sidebar */
.side{background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.brand{display:flex;align-items:center;gap:11px;padding:20px 18px 14px;font-weight:650;font-size:1.12rem;letter-spacing:-.02em}
.mark{width:30px;height:30px;border-radius:50%;background:var(--spectrum);position:relative;flex:none}
.mark::before{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--side)}
.mark::after{content:"";position:absolute;width:5px;height:5px;border-radius:50%;background:#fff;left:11px;top:9px;opacity:.9}
.mark.lg{width:64px;height:64px}.mark.lg::before{inset:15px;background:var(--bg)}.mark.lg::after{width:10px;height:10px;left:24px;top:19px}
.mark.sm{width:26px;height:26px}.mark.sm::before{inset:6px;background:var(--bg)}.mark.sm::after{width:4px;height:4px;left:9px;top:8px}
.newbtn{margin:4px 14px 12px;display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:12px;border:1px solid var(--line2);background:var(--panel);font-weight:550;transition:background .15s,border-color .15s}
.newbtn:hover{background:var(--panel2)}
.newbtn svg{width:16px;height:16px}
.convs{flex:1;overflow:auto;padding:0 8px 8px;min-height:0}
.convs h4{font:600 .74rem var(--sans);color:var(--faint);padding:10px 10px 6px;letter-spacing:.03em}
.ci{display:flex;align-items:center;gap:6px;padding:8px 10px;border-radius:10px;color:var(--muted);cursor:pointer;font-size:.93rem;transition:background .12s,color .12s}
.ci span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ci:hover{background:var(--panel2);color:var(--text)}
.ci.on{background:var(--panel2);color:var(--text)}
.ci button{opacity:0;border:0;background:none;color:var(--faint);padding:2px 6px;border-radius:6px;font-size:1.1rem;line-height:1}
.ci:hover button{opacity:1}.ci button:hover{color:var(--bad)}
.ci .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 1.2s infinite}
.sfoot{border-top:1px solid var(--line);padding:14px 16px;display:grid;gap:12px;font-size:.86rem}
.sfoot .row{display:flex;align-items:center;justify-content:space-between;gap:10px;color:var(--muted)}
.sfoot b{color:var(--text);font-weight:550}
.sw{position:relative;width:38px;height:22px;border-radius:999px;border:1px solid var(--line2);background:var(--panel2);flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .18s,background .18s}
.sw[aria-checked=true]{background:rgba(61,245,167,.22);border-color:var(--accent)}
.sw[aria-checked=true]::after{transform:translateX(16px);background:var(--accent)}
.iconbtn{border:1px solid var(--line);background:var(--panel);border-radius:10px;width:34px;height:34px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{color:var(--text);background:var(--panel2)}
.iconbtn svg{width:17px;height:17px}
/* main */
.main{display:flex;flex-direction:column;min-width:0;min-height:0;position:relative}
.top{display:flex;align-items:center;gap:12px;padding:14px 22px;border-bottom:1px solid var(--line);min-height:61px}
.top .title{font-weight:600;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--muted);font:500 .78rem var(--mono);max-width:46%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-left:auto}
.menu{display:none}
.scroll{flex:1;overflow-y:auto;min-height:0;scroll-behavior:smooth}
.col{width:min(780px,100% - 40px);margin:0 auto;padding:30px 0 20px}
/* empty */
.empty{display:grid;justify-items:center;text-align:center;padding:9vh 0 0;gap:18px}
.empty h1{font-size:clamp(1.8rem,3.4vw,2.5rem);letter-spacing:-.04em;line-height:1.1;font-weight:650}
.empty p{color:var(--muted);max-width:44ch}
.sugs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:20px;width:100%;text-align:left}
.sug{padding:16px 18px;border:1px solid var(--line);border-radius:16px;background:var(--panel);transition:border-color .15s,transform .15s,background .15s}
.sug:hover{border-color:var(--line2);transform:translateY(-2px);background:var(--panel2)}
.sug b{display:block;font-weight:600;margin-bottom:3px;font-size:.95rem}
.sug span{color:var(--muted);font-size:.86rem;line-height:1.4;display:block}
/* messages */
.msg{margin:0 0 22px;animation:in .25s ease both}
.msg.user{display:flex;justify-content:flex-end}
.msg.user .bub{background:var(--user);border-radius:18px 18px 4px 18px;padding:11px 16px;max-width:82%;white-space:pre-wrap;word-wrap:break-word}
.msg.ai{display:grid;grid-template-columns:30px minmax(0,1fr);gap:14px}
.msg.ai .body{min-width:0}
.md>*:first-child{margin-top:0}.md>*:last-child{margin-bottom:0}
.md p{margin:0 0 .85em}.md ul,.md ol{margin:0 0 .85em;padding-left:1.35em}.md li{margin:.25em 0}
.md code{font:500 .88em var(--mono);background:var(--panel2);border:1px solid var(--line);padding:.12em .4em;border-radius:6px}
.md pre{position:relative;margin:.4em 0 1em;background:var(--code);border:1px solid var(--line);border-radius:12px;padding:14px 16px;overflow-x:auto;font:400 .86rem/1.65 var(--mono)}
.md pre code{background:none;border:0;padding:0;font-size:inherit}
.md pre .cp{position:absolute;top:8px;right:8px;border:1px solid var(--line2);background:var(--panel);color:var(--muted);border-radius:8px;font-size:.74rem;padding:3px 9px;opacity:0;transition:opacity .15s}
.md pre:hover .cp{opacity:1}
.md strong{font-weight:650}
.err{border:1px solid rgba(255,123,114,.4);background:rgba(255,123,114,.08);color:var(--bad);border-radius:12px;padding:12px 14px;margin:0 0 22px;font-size:.92rem}
/* tool cards */
.tool{margin:0 0 12px 44px;border:1px solid var(--line);border-radius:14px;background:var(--panel);overflow:hidden;animation:in .25s ease both}
.th{display:flex;align-items:center;gap:11px;padding:10px 14px;cursor:pointer;user-select:none}
.th .ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--panel2);color:var(--muted);flex:none}
.th .ic svg{width:15px;height:15px}
.th .cmd{flex:1;min-width:0;font:500 .86rem var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.th .cmd small{display:block;font:400 .76rem var(--sans);color:var(--muted);overflow:hidden;text-overflow:ellipsis}
.st{font:600 .72rem var(--sans);padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted);flex:none;white-space:nowrap}
.st.run{color:var(--accent);border-color:rgba(61,245,167,.35)}
.st.wait{color:var(--warn);border-color:rgba(245,177,74,.45);background:rgba(245,177,74,.08)}
.st.ok{color:var(--good)}.st.bad{color:var(--bad);border-color:rgba(255,123,114,.4)}
.chev{width:14px;height:14px;color:var(--faint);transition:transform .15s;flex:none}
.tool.open .chev{transform:rotate(90deg)}
.tb{display:none;border-top:1px solid var(--line)}
.tool.open .tb{display:block}
.tb pre{margin:0;padding:12px 16px;max-height:280px;overflow:auto;background:var(--code);font:400 .8rem/1.6 var(--mono);white-space:pre-wrap;word-break:break-word;color:var(--muted)}
.tb .meta{padding:8px 16px;font-size:.78rem;color:var(--faint);border-bottom:1px solid var(--line);font-family:var(--mono)}
.appr{border-top:1px solid rgba(245,177,74,.3);background:rgba(245,177,74,.06);padding:14px 16px;display:grid;gap:12px}
.appr p{font-size:.9rem;color:var(--text)}
.appr p b{color:var(--warn)}
.btns{display:flex;gap:10px}
.btn{border-radius:10px;padding:8px 18px;font-weight:600;font-size:.9rem;border:1px solid var(--line2);background:var(--panel2);transition:transform .12s,background .15s}
.btn:hover{transform:translateY(-1px)}
.btn.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.think{margin:0 0 22px 44px;display:flex;align-items:center;gap:10px;color:var(--muted);font-size:.9rem}
.dots{display:inline-flex;gap:4px}
.dots i{width:6px;height:6px;border-radius:50%;background:var(--accent);animation:bounce 1.1s infinite}
.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
@keyframes bounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}
@keyframes pulse{50%{opacity:.35}}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
/* composer */
.comp{padding:0 20px 20px}
.cbox{width:min(780px,100%);margin:0 auto;border:1px solid var(--line2);background:var(--panel);border-radius:20px;padding:12px 12px 10px 18px;box-shadow:var(--shadow);transition:border-color .15s}
.cbox:focus-within{border-color:var(--accent)}
.cbox textarea{width:100%;border:0;background:none;resize:none;outline:none;max-height:200px;min-height:28px;line-height:1.55;padding:4px 0}
.cbox textarea::placeholder{color:var(--faint)}
.crow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:4px}
.hint{font-size:.78rem;color:var(--faint)}
.send{width:38px;height:38px;border-radius:12px;border:0;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;transition:transform .12s,opacity .15s}
.send:hover{transform:translateY(-1px)}.send:disabled{opacity:.35;cursor:default;transform:none}
.send svg{width:18px;height:18px}
.send.stop{background:var(--panel2);color:var(--text);border:1px solid var(--line2)}
.foot{text-align:center;font-size:.74rem;color:var(--faint);margin-top:10px}
.locked{position:fixed;inset:0;display:none;place-items:center;background:var(--bg);z-index:9;text-align:center;padding:30px}
.locked.on{display:grid}
@media(max-width:860px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset:0 auto 0 0;width:min(300px,86vw);z-index:20;transform:translateX(-100%);transition:transform .22s}
  .side.open{transform:none;box-shadow:var(--shadow)}
  .menu{display:grid}
  .sugs{grid-template-columns:1fr}
  .tool,.think{margin-left:0}
  .msg.ai{grid-template-columns:1fr}.msg.ai>.mark{display:none}
  .chip{max-width:40%}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.scroll{scroll-behavior:auto}}
</style>
</head>
<body>
<div class="app">
  <aside class="side" id="side" aria-label="Conversations">
    <div class="brand"><span class="mark"></span>__NAME__</div>
    <button class="newbtn" id="new"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg>New chat</button>
    <div class="convs" id="convs"></div>
    <div class="sfoot">
      <div class="row"><span>Ask before every command</span><button class="sw" id="askmode" role="switch" aria-checked="false" aria-label="Ask before every command"></button></div>
      <div class="row"><span id="model"></span><button class="iconbtn" id="theme" aria-label="Switch light or dark"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="10" cy="10" r="3.6"/><path d="M10 2.5v1.6M10 15.9v1.6M2.5 10h1.6M15.9 10h1.6M4.7 4.7l1.1 1.1M14.2 14.2l1.1 1.1M15.3 4.7l-1.1 1.1M5.8 14.2l-1.1 1.1"/></svg></button></div>
    </div>
  </aside>
  <section class="main">
    <header class="top">
      <button class="iconbtn menu" id="menu" aria-label="Open menu"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 6h14M3 10h14M3 14h14"/></svg></button>
      <div class="title" id="title">New chat</div>
      <span class="chip" id="cwd" title="Working folder"></span>
    </header>
    <div class="scroll" id="scroll"><div class="col" id="col" aria-live="polite"></div></div>
    <div class="comp">
      <form class="cbox" id="form">
        <textarea id="in" rows="1" placeholder="Ask __NAME__ to do something on this computer…" aria-label="Message" autofocus></textarea>
        <div class="crow"><span class="hint">Enter to send · Shift+Enter for a new line</span>
          <button class="send" id="send" type="submit" aria-label="Send"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 16V4M4.5 9.5L10 4l5.5 5.5"/></svg></button></div>
      </form>
      <div class="foot">__NAME__ runs on your computer with your own AI. Read-only steps run on their own; anything else asks you first.</div>
    </div>
  </section>
</div>
<div class="locked" id="locked"><div><div class="mark lg" style="margin:0 auto 18px"></div><h2>Open __NAME__ from your terminal</h2><p style="color:var(--muted);margin-top:8px">Run <code>newton agent</code> and use the link it prints.</p></div></div>

<script>
(function(){
"use strict";
var NAME="__NAME__";
var $=function(s){return document.querySelector(s)};
var col=$("#col"),scrollEl=$("#scroll"),inp=$("#in"),sendBtn=$("#send");
var S={conv:null,es:null,busy:false,thinking:null,tools:{},seen:0,mode:"smart",list:[]};
var ICON={run:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 5l3.5 3L3 11M8 12h5"/></svg>',
  read:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 2h5l3 3v9H4z"/><path d="M9 2v3h3"/></svg>',
  list:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M2 4.5h4l1.5 1.5H14V13H2z"/></svg>',
  write:'<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M10.5 2.5l3 3L6 13l-3.5.5L3 10z"/></svg>'};
var CHEV='<svg class="chev" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3l4 4-4 4"/></svg>';
var SUGS=[["What's using my disk space?","Find the biggest folders and explain them"],["What changed in this git repo?","Summarize recent commits and uncommitted work"],["Find large files here","List the biggest files in this folder"],["Set up a Python project","Create a folder with a venv and a first test"]];

function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function api(path,opt){opt=opt||{};opt.credentials="same-origin";opt.headers=Object.assign({"Content-Type":"application/json"},opt.headers||{});
  return fetch(path,opt).then(function(r){if(r.status===401){$("#locked").classList.add("on");throw new Error("locked")}return r.json()})}
function post(path,body){return api(path,{method:"POST",body:JSON.stringify(body||{})})}

/* ---------- tiny markdown ---------- */
function md(src){
  var blocks=[],s=String(src||"").replace(/```([\w+-]*)\n([\s\S]*?)```/g,function(_,l,c){blocks.push('<pre><button class="cp" type="button">Copy</button><code>'+esc(c.replace(/\n$/,""))+'</code></pre>');return "\u0000"+(blocks.length-1)+"\u0000"});
  var lines=s.split("\n"),out=[],list=null,para=[];
  function inline(t){return esc(t).replace(/`([^`]+)`/g,"<code>$1</code>").replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*([^*\s][^*]*)\*/g,"$1<em>$2</em>")}
  function flush(){if(para.length){out.push("<p>"+inline(para.join(" "))+"</p>");para=[]}}
  function endList(){if(list){out.push("</"+list+">");list=null}}
  lines.forEach(function(l){
    var m,b=l.match(/^\u0000(\d+)\u0000$/);
    if(b){flush();endList();out.push(blocks[+b[1]]);return}
    if((m=l.match(/^\s*[-*]\s+(.*)/))){flush();if(list!=="ul"){endList();out.push("<ul>");list="ul"}out.push("<li>"+inline(m[1])+"</li>");return}
    if((m=l.match(/^\s*\d+[.)]\s+(.*)/))){flush();if(list!=="ol"){endList();out.push("<ol>");list="ol"}out.push("<li>"+inline(m[1])+"</li>");return}
    if(!l.trim()){flush();endList();return}
    endList();para.push(l.trim());
  });
  flush();endList();return out.join("");
}
col.addEventListener("click",function(e){var b=e.target.closest(".cp");if(!b)return;var t=b.parentNode.querySelector("code").textContent;
  (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(function(){b.textContent="Copied"},function(){b.textContent="Press Ctrl+C"});setTimeout(function(){b.textContent="Copy"},1500)});

/* ---------- rendering ---------- */
function bottom(){scrollEl.scrollTop=scrollEl.scrollHeight}
function nearBottom(){return scrollEl.scrollHeight-scrollEl.scrollTop-scrollEl.clientHeight<160}
function add(el){var nb=nearBottom();col.appendChild(el);if(nb)bottom();return el}
function node(html,cls){var d=document.createElement("div");if(cls)d.className=cls;d.innerHTML=html;return d}
function clearCol(){col.innerHTML="";S.tools={};S.thinking=null}
function empty(){
  clearCol();
  var e=node('<div class="mark lg"></div><h1>What can '+esc(NAME)+' help with?</h1><p>'+esc(NAME)+' looks around your computer, runs commands step by step, and tells you what it found. It asks before changing anything.</p><div class="sugs"></div>',"empty");
  var g=e.querySelector(".sugs");
  SUGS.forEach(function(s){var b=document.createElement("button");b.type="button";b.className="sug";b.innerHTML="<b>"+esc(s[0])+"</b><span>"+esc(s[1])+"</span>";b.onclick=function(){send(s[0])};g.appendChild(b)});
  col.appendChild(e);
}
function addUser(t){add(node('<div class="bub">'+esc(t)+"</div>","msg user"))}
function addAI(t){var d=node('<span class="mark sm"></span><div class="body md">'+md(t)+"</div>","msg ai");add(d)}
function addErr(t){add(node(esc(t),"err"))}
function think(on){
  if(on&&!S.thinking){S.thinking=add(node('<span class="dots"><i></i><i></i><i></i></span><span>'+esc(NAME)+" is working…</span>","think"))}
  else if(!on&&S.thinking){S.thinking.remove();S.thinking=null}
}
function addTool(ev){
  var label=ev.kind==="run"?esc(ev.command):(ev.kind==="read"?"Read "+esc(ev.command):(ev.kind==="list"?"Looked in "+esc(ev.command):"Write "+esc(ev.command)));
  var why=ev.why?"<small>"+esc(ev.why)+"</small>":"";
  var el=node('<div class="th"><span class="ic">'+(ICON[ev.kind]||ICON.run)+'</span><span class="cmd">'+label+why+'</span><span class="st run">'+(ev.auto?"Running":"Starting")+"</span>"+CHEV+'</div><div class="tb"><div class="meta">in '+esc(ev.cwd||"")+"</div><pre>"+(ev.preview?esc(ev.preview):"Waiting for output…")+"</pre></div>","tool");
  el.querySelector(".th").onclick=function(){el.classList.toggle("open")};
  S.tools[ev.id]={el:el,ev:ev};add(el);
}
function setSt(t,txt,cls){var s=t.el.querySelector(".st");s.textContent=txt;s.className="st "+cls}
function finishTool(ev){
  var t=S.tools[ev.id];if(!t)return;
  var pre=t.el.querySelector("pre");
  if(ev.denied){setSt(t,"Denied","bad");pre.textContent="You denied this.";return}
  pre.textContent=ev.output||"(no output)";
  var ok=ev.code===0;
  setSt(t,ev.status==="timeout"?"Timed out":(ev.status==="stopped"?"Stopped":(ok?"Done":"Exit "+ev.code)),ok?"ok":"bad");
  if(!ok||(ev.output||"").length>0&&t.ev.kind!=="run"){}
  if(ev.cwd){$("#cwd").textContent=short(ev.cwd);$("#cwd").title=ev.cwd}
}
function showApproval(ev){
  var t=lastTool();if(!t)return;
  setSt(t,"Needs your OK","wait");t.el.classList.add("open");
  var a=node('<p><b>Waiting for you.</b> '+esc(ev.reason||"")+'</p><div class="btns"><button class="btn go" type="button">Allow</button><button class="btn" type="button">Deny</button></div>',"appr");
  a.dataset.id=ev.id;
  var b=a.querySelectorAll("button");
  b[0].onclick=function(){decide(ev.id,true)};b[1].onclick=function(){decide(ev.id,false)};
  t.el.appendChild(a);if(nearBottom())bottom();b[0].focus({preventScroll:true});
}
function lastTool(){var ks=Object.keys(S.tools);return ks.length?S.tools[ks[ks.length-1]]:null}
function decide(id,allow){var t=S.tools[id];if(t){var a=t.el.querySelector(".appr");if(a)a.querySelectorAll("button").forEach(function(b){b.disabled=true})}post("/api/approve",{conv:S.conv,id:id,allow:allow})}
function resolveApproval(ev){
  var t=S.tools[ev.id];if(!t)return;var a=t.el.querySelector(".appr");if(a)a.remove();
  setSt(t,ev.allow?"Running":"Denied",ev.allow?"run":"bad");
}
function expireApprovals(){Object.keys(S.tools).forEach(function(k){var t=S.tools[k],a=t.el.querySelector(".appr");if(a){a.remove();setSt(t,"Expired","bad")}})}
function short(p){var h=$("#cwd").dataset.home||"";return h&&p.indexOf(h)===0?"~"+p.slice(h.length):p}

function handle(ev){
  S.seen=Math.max(S.seen,(ev.i||0)+1);
  switch(ev.type){
    case"user":addUser(ev.text);break;
    case"thinking":think(true);break;
    case"say":think(false);addAI(ev.text);break;
    case"tool":think(false);addTool(ev);break;
    case"approval":think(false);showApproval(ev);break;
    case"decision":resolveApproval(ev);think(ev.allow);break;
    case"result":finishTool(ev);break;
    case"error":think(false);addErr(ev.text);break;
    case"done":think(false);setBusy(false);refresh();break;
  }
}
function setBusy(b){S.busy=b;sendBtn.classList.toggle("stop",b);sendBtn.setAttribute("aria-label",b?"Stop":"Send");
  sendBtn.innerHTML=b?'<svg viewBox="0 0 20 20" fill="currentColor"><rect x="5" y="5" width="10" height="10" rx="2"/></svg>':'<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 16V4M4.5 9.5L10 4l5.5 5.5"/></svg>';
  sendBtn.disabled=!b&&!inp.value.trim()}
function stream(id,from){
  if(S.es){S.es.close();S.es=null}
  var es=new EventSource("/api/stream/"+id+"?from="+from);S.es=es;
  es.onmessage=function(m){try{handle(JSON.parse(m.data))}catch(e){}};
  es.onerror=function(){/* the browser retries on its own */};
}

/* ---------- actions ---------- */
function ensureConv(){return S.conv?Promise.resolve(S.conv):post("/api/conv").then(function(r){S.conv=r.id;S.seen=0;stream(r.id,0);return r.id})}
function send(text){
  text=(text||inp.value).trim();if(!text||S.busy)return;
  if(!S.conv)clearCol();
  inp.value="";grow();setBusy(true);
  ensureConv().then(function(id){return post("/api/send",{conv:id,text:text})}).then(function(r){
    if(!r.ok){setBusy(false)}
    $("#title").textContent=$("#title").textContent==="New chat"?text.slice(0,48):$("#title").textContent;
  }).catch(function(){setBusy(false)});
}
function stop(){if(S.conv)post("/api/stop",{conv:S.conv})}
function newChat(){if(S.es){S.es.close();S.es=null}S.conv=null;S.busy=false;setBusy(false);$("#title").textContent="New chat";empty();markList();closeSide();inp.focus()}
function openConv(id){
  if(S.es){S.es.close();S.es=null}
  api("/api/conv/"+id).then(function(c){
    S.conv=id;clearCol();S.seen=0;$("#title").textContent=c.title;
    c.events.forEach(function(e){handle(e)});
    if(!c.busy){expireApprovals();think(false)}
    setBusy(!!c.busy);
    if(c.cwd){$("#cwd").textContent=short(c.cwd)}
    stream(id,S.seen);markList();closeSide();bottom();
  });
}
function refresh(){api("/api/state").then(function(s){S.list=s.conversations;renderList()})}
function renderList(){
  var box=$("#convs");box.innerHTML="";
  if(!S.list.length){return}
  var h=document.createElement("h4");h.textContent="Recent";box.appendChild(h);
  S.list.forEach(function(c){
    var d=document.createElement("div");d.className="ci"+(c.id===S.conv?" on":"");d.dataset.id=c.id;
    d.innerHTML=(c.busy?'<i class="dot"></i>':"")+"<span>"+esc(c.title)+'</span><button type="button" aria-label="Delete chat" title="Delete">×</button>';
    d.onclick=function(e){if(e.target.tagName==="BUTTON"){api("/api/conv/"+c.id,{method:"DELETE"}).then(function(){if(S.conv===c.id)newChat();refresh()});return}openConv(c.id)};
    box.appendChild(d);
  });
}
function markList(){[].forEach.call(document.querySelectorAll(".ci"),function(e){e.classList.toggle("on",e.dataset.id===S.conv)})}
function closeSide(){$("#side").classList.remove("open")}
function grow(){inp.style.height="auto";inp.style.height=Math.min(inp.scrollHeight,200)+"px";if(!S.busy)sendBtn.disabled=!inp.value.trim()}

$("#form").addEventListener("submit",function(e){e.preventDefault();S.busy?stop():send()});
inp.addEventListener("input",grow);
inp.addEventListener("keydown",function(e){if(e.key==="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();if(!S.busy)send()}});
$("#new").onclick=newChat;
$("#menu").onclick=function(){$("#side").classList.toggle("open")};
$("#askmode").onclick=function(){var on=this.getAttribute("aria-checked")!=="true";this.setAttribute("aria-checked",on);post("/api/mode",{mode:on?"ask":"smart"})};
$("#theme").onclick=function(){var t=document.documentElement.dataset.theme==="dark"?"light":"dark";document.documentElement.dataset.theme=t;try{localStorage.setItem("iris-theme",t)}catch(e){}};
try{var th=localStorage.getItem("iris-theme");if(th)document.documentElement.dataset.theme=th;else if(window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches)document.documentElement.dataset.theme="light"}catch(e){}
document.addEventListener("keydown",function(e){if(e.key==="Escape"&&S.busy)stop()});

api("/api/state").then(function(s){
  $("#model").innerHTML="<b>"+esc(s.provider)+"</b> · "+esc(s.model);
  $("#cwd").dataset.home=s.home;$("#cwd").textContent=short(s.cwd);$("#cwd").title=s.cwd;
  $("#askmode").setAttribute("aria-checked",s.mode==="ask");
  S.list=s.conversations;renderList();empty();setBusy(false);inp.focus();
}).catch(function(){});
})();
</script>
</body>
</html>
