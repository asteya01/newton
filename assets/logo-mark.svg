<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512"><defs>
  <linearGradient id="tile" x1="0.2" y1="0" x2="0.8" y2="1"><stop offset="0" stop-color="#1A212C"/><stop offset="0.55" stop-color="#0E131A"/><stop offset="1" stop-color="#070A0E"/></linearGradient>
  <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/><stop offset="0.35" stop-color="#FFFFFF" stop-opacity="0.05"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0.02"/></linearGradient>
  <radialGradient id="halo" cx="0.66" cy="0.36" r="0.55"><stop offset="0" stop-color="#46F2A8" stop-opacity="0.20"/><stop offset="1" stop-color="#46F2A8" stop-opacity="0"/></radialGradient>
  <radialGradient id="sheen" cx="0.25" cy="0.05" r="0.7"><stop offset="0" stop-color="#FFFFFF" stop-opacity="0.07"/><stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/></radialGradient>
  <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#D4FA6A"/><stop offset="0.55" stop-color="#7DF08A"/><stop offset="1" stop-color="#22DDA0"/></linearGradient>
  <radialGradient id="orb" cx="0.36" cy="0.32" r="0.78"><stop offset="0" stop-color="#F2FFB8"/><stop offset="0.35" stop-color="#B9F566"/><stop offset="0.75" stop-color="#3FE39A"/><stop offset="1" stop-color="#16B97F"/></radialGradient>
  <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0"><stop offset="0" stop-color="#7EE86F"/><stop offset="1" stop-color="#D8FB72"/></linearGradient>
  <linearGradient id="trail" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#9BF57A" stop-opacity="0.7"/><stop offset="1" stop-color="#9BF57A" stop-opacity="0"/></linearGradient>
  <linearGradient id="cursor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#D5DCE6"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="16"/></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="clip"><rect x="16" y="16" width="480" height="480" rx="112"/></clipPath></defs>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#tile)"/>
  <g clip-path="url(#clip)">
    <rect x="16" y="16" width="480" height="480" fill="url(#halo)"/>
    <rect x="16" y="16" width="480" height="480" fill="url(#sheen)"/>
    <!-- glows -->
    <circle cx="336" cy="200" r="58" fill="#3DF5A7" opacity="0.45" filter="url(#blur)"/>
    <path d="M120 236 L222 318 L120 400" fill="none" stroke="#7DF08A" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" opacity="0.35" filter="url(#blur)"/>
  </g>
  <rect x="17.5" y="17.5" width="477" height="477" rx="110.5" fill="none" stroke="url(#rim)" stroke-width="3"/>
  <!-- motion trail -->
  <rect x="300" y="64" width="10" height="56" rx="5" fill="url(#trail)" opacity="0.55"/>
  <rect x="331" y="44" width="10" height="70" rx="5" fill="url(#trail)" opacity="0.8"/>
  <rect x="362" y="70" width="10" height="44" rx="5" fill="url(#trail)" opacity="0.45"/>
  <!-- the apple -->
  <ellipse cx="336" cy="252" rx="40" ry="6" fill="#000" opacity="0.35" filter="url(#soft)"/>
  <circle cx="336" cy="196" r="54" fill="url(#orb)"/>
  <ellipse cx="318" cy="174" rx="17" ry="11" transform="rotate(-35 318 174)" fill="#FFFFFF" opacity="0.55"/>
  <path d="M337 143 C 337 136, 338 130, 341 124" stroke="#2E7D57" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M340 140 C 346 116, 368 106, 390 110 C 386 133, 365 146, 340 140 Z" fill="url(#leaf)"/>
  <path d="M344 136 C 356 126, 370 118, 384 114" stroke="#5CC56E" stroke-width="2.5" stroke-linecap="round" fill="none" opacity="0.8"/>
  <!-- the prompt -->
  <path d="M120 236 L222 318 L120 400" fill="none" stroke="url(#glow)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="262" y="372" width="126" height="40" rx="20" fill="url(#cursor)"/></svg>